services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: recrute-tchad-app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ../backend:/var/www/backend:z
    depends_on:
      - db
      - redis
      - minio
    networks:
      - recrute-network

  # Reverse proxy PHP (API Laravel). L’app React vit dans ../web (Vite :3000).
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../backend:/var/www/backend:z
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:z
    depends_on:
      - app
    networks:
      - recrute-network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-recrutement_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - recrute-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-recrutement_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - recrute-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "8900:8900"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":8900"
    volumes:
      - minio-data:/data
    networks:
      - recrute-network

networks:
  recrute-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
  minio-data:
